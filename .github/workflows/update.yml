name: Update football mirror

on:
  workflow_dispatch:
  schedule:
    - cron: "5 * * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gunluk mac verilerini cek
        run: python update_data.py

      - name: Verileri GitHub'a kaydet
        run: |
          git config user.name "football-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/today.json data/tomorrow.json
          git diff --cached --quiet || git commit -m "update daily football data"
          git push
